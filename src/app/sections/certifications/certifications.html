<section id="certifications" class="relative px-6 py-16 sm:px-10">
  <div class="mx-auto max-w-4xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Certifications</p>
    <h2 [appReveal]="0.05" class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">
      Always leveling up.
    </h2>

    <div class="mt-10 grid gap-5 sm:grid-cols-2">
      @for (cert of certifications; track cert.name; let i = $index) {
        <div appCard [appReveal]="0.05 * i" class="flex items-start gap-4">
          <svg lucideGraduationCap class="h-6 w-6 shrink-0 text-accent"></svg>
          <div>
            <h3 class="font-semibold">{{ cert.name }}</h3>
            <p class="mt-1 text-sm text-fg-muted">{{ cert.issuer }}</p>
            <span appBadge class="mt-3 inline-block">{{ cert.status }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
