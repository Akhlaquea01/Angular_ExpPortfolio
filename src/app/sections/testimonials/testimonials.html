<section id="testimonials" class="relative px-6 py-16 sm:px-10">
  <div class="mx-auto max-w-6xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Testimonials</p>
    <h2 [appReveal]="0.05" class="mt-3 max-w-2xl text-3xl font-semibold tracking-tight sm:text-4xl">
      What people I've worked with say.
    </h2>

    <div class="mt-14 columns-1 gap-6 sm:columns-2 lg:columns-3 [&>*]:mb-6 [&>*]:break-inside-avoid">
      @for (t of testimonials; track t.name; let i = $index) {
        <div appCard [appReveal]="0.03 * i">
          <svg lucideQuote class="h-5 w-5 text-accent/60"></svg>
          <p class="mt-3 text-sm leading-relaxed text-fg-muted">{{ t.message }}</p>
          <div class="mt-5 flex items-center gap-3">
            <img [src]="t.image" [alt]="t.name" loading="lazy" class="h-10 w-10 rounded-full object-cover" />
            <div>
              <p class="text-sm font-semibold">{{ t.name }}</p>
              <p class="text-xs text-fg-subtle">{{ t.company }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
