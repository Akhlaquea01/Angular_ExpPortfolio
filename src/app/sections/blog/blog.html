<section id="blog" class="relative px-6 py-16 sm:px-10">
  <div class="mx-auto max-w-4xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Writing</p>
    <h2 [appReveal]="0.05" class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Notes & writing.</h2>

    <div class="mt-10 grid gap-5 sm:grid-cols-2">
      @for (post of posts; track post.title) {
        <a appCard [href]="post.url" target="_blank" rel="noopener">
          <p class="font-mono text-xs text-fg-subtle">{{ post.date }}</p>
          <h3 class="mt-2 font-semibold">{{ post.title }}</h3>
          <p class="mt-2 text-sm text-fg-muted">{{ post.summary }}</p>
        </a>
      }
    </div>
  </div>
</section>
