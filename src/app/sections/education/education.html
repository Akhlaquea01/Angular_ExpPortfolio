<section id="education" class="relative px-6 py-24 sm:px-10">
  <div class="mx-auto max-w-3xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Education</p>
    <h2 [appReveal]="0.05" class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">
      Academic background.
    </h2>

    <div class="mt-10 space-y-5">
      @for (item of items; track item.title; let i = $index) {
        <div appCard [appReveal]="0.05 * i" class="flex items-start gap-4">
          <svg lucideGraduationCap class="h-6 w-6 shrink-0 text-accent"></svg>
          <div>
            <div class="flex flex-wrap items-baseline justify-between gap-2">
              <h3 class="font-semibold">{{ item.title }}</h3>
              <span class="font-mono text-xs text-fg-subtle">{{ item.date }}</span>
            </div>
            <p class="mt-1 text-sm text-fg-muted">{{ item.institution }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
