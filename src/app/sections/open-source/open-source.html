<section id="open-source" class="relative px-6 py-24 sm:px-10">
  <div class="mx-auto max-w-4xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Open Source</p>
    <h2 [appReveal]="0.05" class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">
      Community contributions.
    </h2>

    <div class="mt-10 grid gap-5 sm:grid-cols-2">
      @for (item of items; track item.name) {
        <a appCard [href]="item.url" target="_blank" rel="noopener">
          <h3 class="font-semibold">{{ item.name }}</h3>
          <p class="mt-2 text-sm text-fg-muted">{{ item.description }}</p>
        </a>
      }
    </div>
  </div>
</section>
