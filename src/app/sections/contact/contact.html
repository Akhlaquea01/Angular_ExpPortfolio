<section id="contact" class="relative px-6 py-28 sm:px-10">
  <div class="mx-auto max-w-5xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Contact</p>
    <h2 [appReveal]="0.05" class="mt-3 max-w-2xl text-3xl font-semibold tracking-tight sm:text-4xl">
      Let's build something reliable together.
    </h2>

    <div class="mt-14 grid gap-6 lg:grid-cols-[0.8fr_1.2fr]">
      <div [appReveal]="0.1" class="space-y-4">
        <a appCard appMagnetic [href]="'mailto:' + profile.email" class="flex items-center gap-4 p-5!">
          <svg lucideMail class="h-5 w-5 shrink-0 text-accent"></svg>
          <div>
            <p class="text-xs text-fg-subtle">Email</p>
            <p class="text-sm font-medium">{{ profile.email }}</p>
          </div>
        </a>
        <a appCard appMagnetic [href]="'tel:' + profile.phone" class="flex items-center gap-4 p-5!">
          <svg lucidePhone class="h-5 w-5 shrink-0 text-accent"></svg>
          <div>
            <p class="text-xs text-fg-subtle">Phone</p>
            <p class="text-sm font-medium">{{ profile.phone }}</p>
          </div>
        </a>
        <div appCard class="flex items-center gap-4 p-5!">
          <svg lucideMapPin class="h-5 w-5 shrink-0 text-accent"></svg>
          <div>
            <p class="text-xs text-fg-subtle">Location</p>
            <p class="text-sm font-medium">{{ profile.location }}</p>
          </div>
        </div>
        <div class="flex gap-3">
          <a
            appBtn="outline"
            appMagnetic
            [href]="profile.github"
            target="_blank"
            rel="noopener"
            aria-label="GitHub profile"
          >
            <img src="/images/logo/github.svg" alt="" class="h-4 w-4" />
            GitHub
          </a>
          <a
            appBtn="outline"
            appMagnetic
            [href]="profile.linkedin"
            target="_blank"
            rel="noopener"
            aria-label="LinkedIn profile"
          >
            <img src="/images/logo/linkedin.svg" alt="" class="h-4 w-4" />
            LinkedIn
          </a>
        </div>
      </div>

      <form appCard [appReveal]="0.15" class="space-y-4" (ngSubmit)="sendMail()" #contactForm="ngForm">
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="name" class="text-xs font-medium text-fg-muted">Name</label>
            <input
              id="name"
              name="name"
              [(ngModel)]="name"
              required
              class="surface-neo-inset mt-1.5 w-full rounded-xl px-4 py-2.5 text-sm outline-none"
            />
          </div>
          <div>
            <label for="email" class="text-xs font-medium text-fg-muted">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              class="surface-neo-inset mt-1.5 w-full rounded-xl px-4 py-2.5 text-sm outline-none"
            />
          </div>
        </div>
        <div>
          <label for="message" class="text-xs font-medium text-fg-muted">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            [(ngModel)]="message"
            required
            class="surface-neo-inset mt-1.5 w-full resize-none rounded-xl px-4 py-2.5 text-sm outline-none"
          ></textarea>
        </div>
        <button
          appBtn="primary"
          appMagnetic
          type="submit"
          [disabled]="contactForm.invalid"
          class="w-full sm:w-auto"
        >
          Send message
          <svg lucideSend class="h-4 w-4"></svg>
        </button>
        <p class="text-xs text-fg-subtle">
          Opens your email client with the message pre-filled — nothing is sent from this page directly.
        </p>
      </form>
    </div>
  </div>
</section>
