<section id="achievements" class="relative px-6 py-28 sm:px-10">
  <div class="mx-auto max-w-6xl">
    <p [appReveal]="0" class="text-sm font-medium uppercase tracking-widest text-accent">Achievements</p>
    <h2 [appReveal]="0.05" class="mt-3 max-w-2xl text-3xl font-semibold tracking-tight sm:text-4xl">
      Impact, measured.
    </h2>

    <div class="mt-14 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (stat of stats; track stat.label; let i = $index) {
        <div appCard [appReveal]="0.05 * i" class="text-center">
          <p class="text-gradient font-mono text-4xl font-semibold">
            <span
              [appCounter]="stat.value"
              [decimals]="stat.value % 1 !== 0 ? 1 : 0"
              [suffix]="stat.suffix"
            ></span>
          </p>
          <p class="mt-2 text-sm font-medium text-fg">{{ stat.label }}</p>
          <p class="mt-1 text-xs text-fg-subtle">{{ stat.description }}</p>
        </div>
      }
    </div>

    <div class="mt-8 grid gap-4 sm:grid-cols-2">
      @for (item of achievements; track item.title; let i = $index) {
        <div appCard [appReveal]="0.04 * i" class="flex gap-4">
          <svg lucideAward class="h-5 w-5 shrink-0 text-accent"></svg>
          <div>
            <h3 class="font-semibold">{{ item.title }}</h3>
            <p class="mt-1 text-sm leading-relaxed text-fg-muted">{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
