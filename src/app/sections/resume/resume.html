<section id="resume" class="relative px-6 py-24 sm:px-10">
  <div
    appCard
    [appReveal]="0"
    class="mx-auto flex max-w-4xl flex-col items-center gap-6 text-center sm:flex-row sm:text-left"
  >
    <div class="flex-1">
      <p class="text-sm font-medium uppercase tracking-widest text-accent">Resume</p>
      <h2 class="mt-3 text-2xl font-semibold tracking-tight sm:text-3xl">
        Want the full story on paper?
      </h2>
      <p class="mt-3 text-sm leading-relaxed text-fg-muted">
        Grab a copy of my full resume — experience, projects, and skills in one PDF.
      </p>
    </div>
    <div class="flex shrink-0 flex-col gap-3 sm:flex-row">
      <a appBtn="primary" appMagnetic [href]="resumeUrl" download>
        <svg lucideDownload class="h-4 w-4"></svg>
        Download PDF
      </a>
      <a appBtn="outline" appMagnetic [href]="resumeUrl" target="_blank" rel="noopener">
        <svg lucideExternalLink class="h-4 w-4"></svg>
        View
      </a>
    </div>
  </div>
</section>
