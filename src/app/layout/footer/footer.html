<footer class="border-t border-border px-6 py-10 sm:px-10">
  <div
    class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 text-center sm:flex-row sm:text-left"
  >
    <p class="text-sm text-fg-subtle">© {{ year }} {{ profile.name }}. Built with Angular & Tailwind CSS.</p>
    <div class="flex items-center gap-4">
      <a [href]="profile.github" target="_blank" rel="noopener" class="text-sm text-fg-muted hover:text-fg">
        GitHub
      </a>
      <a [href]="profile.linkedin" target="_blank" rel="noopener" class="text-sm text-fg-muted hover:text-fg">
        LinkedIn
      </a>
      <a [href]="'mailto:' + profile.email" class="text-sm text-fg-muted hover:text-fg">Email</a>
    </div>
  </div>
</footer>
